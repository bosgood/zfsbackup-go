# ZFS + S3 integration test: MinIO and the `integration` image of the root
# Dockerfile. Run it with make integration-docker (see integration/README.md);
# the host kernel must have the zfs module.
name: zfsbackup-integration
services:
  minio:
    # MinIO publishes no images any more; pgsty/minio is a community build of
    # its releases. Pinned; bump on purpose.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 2s
      retries: 30
  zfs:
    build:
      context: ..
      dockerfile: Dockerfile
      target: integration
      args:
        GO_VERSION: "${GO_VERSION:-1.26}"
    privileged: true
    devices: ["/dev/zfs:/dev/zfs"]
    # The pool's file: the zfs module opens it by this path on the host.
    volumes:
      - /var/tmp/zfsbackup-it:/var/tmp/zfsbackup-it
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_S3_CUSTOM_ENDPOINT: http://minio:9000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      ZFSBACKUP_TEST_POOL: zbtest
      RUN: "${RUN:-TestIntegrationS3}"
