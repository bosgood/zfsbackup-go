# ZFS + S3 integration test: MinIO and the `integration` image of the root
# Dockerfile. Run it with make integration-docker (see integration/README.md);
# the host kernel must have the zfs module.
name: zfsbackup-integration
services:
  minio:
    # MinIO publishes no images any more; pgsty/minio is a community build of
    # its releases. Pinned; bump on purpose.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 2s
      retries: 30
  # Adds the MinIO user nodelete, who may list, read and write but not delete
  # (nodelete-policy.json), for TestIntegrationS3CleanLocal/Denied. pgsty/mc
  # is the community build of mc that goes with pgsty/minio. Pinned; bump on
  # purpose. Each step can run again: user add updates the user and policy
  # create replaces the policy. attach fails when the user already has the
  # policy, so its failure is ignored; the last step then checks that the user
  # has a policy (user info --json has a policyName key only then; the image
  # has no grep, so sh's case does the match) and fails the service if not.
  # The image is pinned by tag and digest: a community build with the root key.
  # make integration-docker does not attach to this service: its exit must
  # not stop the others (--abort-on-container-exit).
  mc:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./nodelete-policy.json:/nodelete-policy.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc admin user add local nodelete nodelete-secret &&
        mc admin policy create local nodelete /nodelete-policy.json &&
        { mc admin policy attach local nodelete --user nodelete || true; } &&
        case "$$(mc admin user info local nodelete --json)" in
        *policyName*) echo "nodelete has a policy" ;;
        *) echo "nodelete has NO policy" >&2; exit 1 ;;
        esac
  zfs:
    build:
      context: ..
      dockerfile: Dockerfile
      target: integration
      args:
        GO_VERSION: "${GO_VERSION:-1.26}"
    privileged: true
    devices: ["/dev/zfs:/dev/zfs"]
    # The pool's file: the zfs module opens it by this path on the host.
    volumes:
      - /var/tmp/zfsbackup-it:/var/tmp/zfsbackup-it
    depends_on:
      minio:
        condition: service_healthy
      mc:
        condition: service_completed_successfully
    environment:
      AWS_S3_CUSTOM_ENDPOINT: http://minio:9000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      ZFSBACKUP_TEST_POOL: zbtest
      ZFSBACKUP_IT_NODELETE_KEY: nodelete
      ZFSBACKUP_IT_NODELETE_SECRET: nodelete-secret
      RUN: "${RUN:-TestIntegrationS3}"
