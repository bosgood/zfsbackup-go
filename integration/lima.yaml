# NixOS VM with the zfs kernel module and Docker, for make integration-vm.
# The image is nixos-lima's (github.com/nixos-lima/nixos-lima, nixos.yaml of
# the same tag). It has no zfs or Docker yet: make integration-vm-up applies
# integration/nixos/ with nixos-rebuild on the first start.
images:
  - location: "https://github.com/nixos-lima/nixos-lima/releases/download/v0.2.2/nixos-lima-v0.2.2-aarch64.qcow2"
    arch: "aarch64"
    digest: "sha512:bfcb703cdbad28cfd27438dc009408a859f3c4f575d3598d9627ea712c66128e0fa015de2010ce42bb724abc49f45029a4fc81891fb1a04c567378a6fdf31903"
  - location: "https://github.com/nixos-lima/nixos-lima/releases/download/v0.2.2/nixos-lima-v0.2.2-x86_64.qcow2"
    arch: "x86_64"
    digest: "sha512:cdf15475c6f799d3a355da50147fa81316e43e159b1b2e76eb21046f9fe8499770840ef876daaf85a2f5eb3a73445c4fa87d0337533fdf6f116d80c40806fbc9"
vmType: vz
cpus: 4
memory: 6GiB
disk: 30GiB
# Same path inside the VM, so $(CURDIR) works there. Read-only: the test
# builds its image from the tree and writes nothing to it.
mounts:
  - location: "~"
    writable: false
# From nixos-lima's nixos.yaml: keep Lima's port forwarder off the guest's
# DHCP client port (nixos-lima/nixos-lima#50).
portForwards:
  - proto: udp
    guestPort: 68
    guestIP: 0.0.0.0
    ignore: true
containerd:
  system: false
  user: false
