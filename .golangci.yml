version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - dupl
    - errcheck
    - funlen
    - gocritic
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    dupl:
      threshold: 100
    funlen:
      lines: 100
      statements: 80
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - commentedOutCode
        - filepathJoin
        - hugeParam
        - octalLiteral
        - paramTypeCombine
        - rangeValCopy
        - sloppyReassign
        - unnamedResult
    gosec:
      excludes:
        - G115 # integer overflow conversion: sizes and counts here fit
        - G204 # zfs and the compressors are subprocesses by design
        - G703 # path traversal: paths come from the user's own flags and config
        - G704 # SSRF: hosts come from the user's own flags and config
    govet:
      enable:
        - shadow
    lll:
      line-length: 140
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - funlen
          - gosec
          - lll
          - nakedret
          - unparam
        path: _test\.go
      # x/crypto/openpgp is deprecated but is the format of existing backups.
      - linters:
          - staticcheck
        text: 'SA1019: "golang.org/x/crypto/openpgp'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/someone1/zfsbackup-go
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
